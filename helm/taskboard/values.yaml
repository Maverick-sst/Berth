fullnameOverride: ""

frontend:
  # CI publishes nested under the repo name: ghcr.io/<owner>/<repo>/berth-<app>
  # (see .github/workflows/ci-cd.yml "Compute lowercase image names").
  image: ghcr.io/YOUR_GHCR_USERNAME/berth/berth-frontend
  # tag: pin a full 40-char commit SHA from a green CI run — never "latest"
  # for real deploys (the CI kind smoke overrides this value with its own
  # local tag, so this default is only used when deploying manually).
  tag: latest
backend:
  image: ghcr.io/YOUR_GHCR_USERNAME/berth/berth-backend
  tag: latest

replicaCount: 2
namespace: berth
imagePullSecrets: []

postgres:
  host: berth-postgres
  database: berth
  username: berth
  password: changeme-in-prod

ingress:
  enabled: false
  host: berth.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}

monitoring:
  serviceMonitor:
    enabled: true
