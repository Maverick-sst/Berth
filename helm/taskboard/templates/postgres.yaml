apiVersion: v1
kind: Secret
metadata: {name: berth-postgres}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Values.postgres.host }}}
spec:
  selector: {app: berth-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Values.postgres.host }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: berth-postgres}}
  template:
    metadata: {labels: {app: berth-postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - name: POSTGRES_DB
          value: "{{ .Values.postgres.database }}"
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: berth-postgres, key: username}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: berth-postgres, key: password}}
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: berth-postgres-data}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: berth-postgres-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
