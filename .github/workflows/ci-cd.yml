name: Berth CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {contents: read, packages: write}

jobs:
  test:
    name: Test - Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Scan, Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        id: images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY##*/}"
          REPO="${REPO,,}"
          echo "prefix=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "prefix is: ghcr.io/${OWNER}/${REPO}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ steps.images.outputs.prefix }}/berth-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ steps.images.outputs.prefix }}/berth-frontend:${{ github.sha }}

      - name: Scan backend image (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/berth-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan frontend image (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/berth-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push backend image (immutable commit SHA tag)
        run: docker push ${{ steps.images.outputs.prefix }}/berth-backend:${{ github.sha }}

      - name: Push frontend image (immutable commit SHA tag)
        run: docker push ${{ steps.images.outputs.prefix }}/berth-frontend:${{ github.sha }}

  # Real-cluster deployments stay manual per docs/CLOUD_RUNBOOK.md so no
  # cloud credentials live in this repository.
  smoke-kind:
    name: Smoke test on kind
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Build, load, and deploy on kind
        run: |
          docker build -t berth-backend:smoke ./backend
          docker build -t berth-frontend:smoke ./frontend
          kind load docker-image berth-backend:smoke --name chart-testing
          kind load docker-image berth-frontend:smoke --name chart-testing
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install berth ./helm/taskboard \
            --namespace berth --create-namespace \
            --set backend.image=berth-backend --set backend.tag=smoke \
            --set frontend.image=berth-frontend --set frontend.tag=smoke \
            --set replicaCount=1 --set hpa.enabled=false \
            --set monitoring.serviceMonitor.enabled=false

      - name: Wait for backend readiness
        run: |
          kubectl wait --for=condition=available deployment/berth-berth-backend -n berth --timeout=180s

      - name: Smoke test API
        run: |
          kubectl port-forward -n berth service/berth-berth-backend 8001:8000 &
          sleep 5
          curl -sf http://localhost:8001/health
          curl -sf http://localhost:8001/ready
          curl -sf -X POST http://localhost:8001/api/projects -H 'Content-Type: application/json' -d '{"name":"Smoke Project"}'
