apiVersion: apps/v1
kind: Deployment
metadata:
  name: berth-backend
  namespace: berth
  labels:
    app: berth-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: berth-backend
  template:
    metadata:
      labels:
        app: berth-backend
    spec:
      containers:
        - name: backend
          image: nensiravaliya28/berth-backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./berth.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: berth-frontend
  namespace: berth
  labels:
    app: berth-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: berth-frontend
  template:
    metadata:
      labels:
        app: berth-frontend
    spec:
      containers:
        - name: frontend
          image: nensiravaliya28/berth-frontend:__IMAGE_TAG__
          ports:
            - containerPort: 80
