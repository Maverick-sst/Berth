apiVersion: v1
kind: Service
metadata:
  name: berth-backend
  namespace: berth
spec:
  selector:
    app: berth-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: berth-frontend
  namespace: berth
spec:
  selector:
    app: berth-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
